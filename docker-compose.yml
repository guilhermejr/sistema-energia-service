services:
  energia-service:
    image: guilhermejr/sistema-energia-service
    container_name: energia-service
    restart: always
    env_file: /home/guilhermejr/secrets/energia-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9001:9001"

networks:
  default:
    external: true
    name: rede